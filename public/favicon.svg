<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="EVER-SKETCH">
  <title>EVER-SKETCH</title>
  <rect x="0" y="0" width="512" height="512" rx="104" fill="#0F1B3D"/>
  <!-- the drawn sketch line (freehand stroke) -->
  <path d="M 150,372 Q 202,326 252,372 T 356,362"
        fill="none" stroke="#DCE7FF" stroke-width="22"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- pencil: drawn upright (tip down), then rotated 30deg so the tip meets the line -->
  <g transform="rotate(30 256 256)">
    <!-- eraser -->
    <rect x="224" y="96" width="64" height="30" rx="11" fill="#D98A2A"/>
    <!-- ferrule (metal band) -->
    <rect x="224" y="126" width="64" height="24" fill="#AEB6C2"/>
    <rect x="224" y="132" width="64" height="4" fill="#889"/>
    <rect x="224" y="142" width="64" height="4" fill="#889"/>
    <!-- body -->
    <rect x="224" y="150" width="64" height="180" fill="#2462EB"/>
    <rect x="231" y="150" width="12" height="180" fill="#ffffff" opacity="0.28"/>
    <!-- wood cone -->
    <path d="M 224,330 L 288,330 L 256,392 Z" fill="#EBC99A"/>
    <!-- graphite tip -->
    <path d="M 241,362 L 271,362 L 256,392 Z" fill="#22314F"/>
  </g>
</svg>
